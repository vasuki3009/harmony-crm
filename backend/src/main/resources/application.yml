# Default profile: in-memory H2 -> run with zero setup:  mvn spring-boot:run
# Production profile: PostgreSQL     ->  SPRING_PROFILES_ACTIVE=prod (see docker-compose.yml)
server:
  port: 8081

spring:
  application:
    name: harmony-crm
  datasource:
    url: jdbc:h2:mem:harmony;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Base64 encoded key (>= 32 bytes). Override with JWT_SECRET in any real deployment.
    secret: ${JWT_SECRET:MT3wC0Cs8sX7yvI+GCfPdSWpJmeVx4OHP6utmoujFYqeKVaovmvJJUtFWGTD07sF}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${SEED_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/harmony}
    username: ${DB_USERNAME:harmony}
    password: ${DB_PASSWORD:harmony}
  jpa:
    hibernate:
      ddl-auto: update
