# Run the whole stack:  docker compose up --build
#   Frontend  http://localhost:3000
#   API       http://localhost:8081   (Swagger UI: /swagger-ui.html)
#   Login     sarah@harmonycrm.io / password
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harmony
      POSTGRES_USER: harmony
      POSTGRES_PASSWORD: harmony
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmony -d harmony"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/harmony
      DB_USERNAME: harmony
      DB_PASSWORD: harmony
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Change this for any real deployment:  openssl rand -base64 48
      JWT_SECRET: MT3wC0Cs8sX7yvI+GCfPdSWpJmeVx4OHP6utmoujFYqeKVaovmvJJUtFWGTD07sF
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8081
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
