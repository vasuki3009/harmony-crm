name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  backend:
    name: Backend tests (Java 17, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn -B test

  backend-postgres:
    name: Backend on PostgreSQL (Flyway migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: harmony
          POSTGRES_USER: harmony
          POSTGRES_PASSWORD: harmony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harmony -d harmony"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_TESTS: 'true'
      DB_URL: jdbc:postgresql://localhost:5432/harmony
      DB_USERNAME: harmony
      DB_PASSWORD: harmony
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run PostgreSQL integration test
        run: mvn -B test -Dtest=PostgresIntegrationTest

  frontend:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
